<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Defaults (English) for crawlers and link previews that don't run JavaScript.
      Tags marked data-rh are replaced at runtime by react-helmet with the active language's version.
      The site address comes from VITE_SITE_URL in .env.
    -->
    <title>Konstantinos Oikonomou | Frontend & Full-Stack Engineer</title>
    <meta
      name="description"
      content="Frontend & Full-Stack Engineer in Thessaloniki, Greece. Web platforms for municipalities, research institutions and public bodies, with React and Next.js."
      data-rh="true"
    />
    <meta name="author" content="Konstantinos Oikonomou" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="%VITE_SITE_URL%/" data-rh="true" />

    <!-- Language versions -->
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="el" href="%VITE_SITE_URL%/?lang=el" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->

    <meta property="profile:first_name" content="Konstantinos" />
    <meta property="profile:last_name" content="Oikonomou" />

    <meta property="og:locale:alternate" content="el_GR" data-rh="true" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Konstantinos Oikonomou, Frontend & Full-Stack Engineer: 20+ live deployments across 15+ municipalities" />

    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />

    <!-- Hero photo: fetched in parallel with the app bundle (same srcset as the <img> in HeroSection) -->
